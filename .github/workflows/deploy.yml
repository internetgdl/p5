name: Deploy Worker

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:

  # ==========================================
  # 1. TESTS
  # ==========================================
  test:
    name: Run tests
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npx vitest run --coverage --reporter=default --reporter=github-actions

      - name: Report coverage
        if: always()
        uses: davelosert/vitest-coverage-report-action@v2


  # ==========================================
  # 2. DEPLOY DEV
  # ==========================================
  deploy-dev:
    name: Deploy to DEV

    needs: test

    runs-on: ubuntu-latest

    permissions:
      contents: read

    environment: development

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Deploy to DEV
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy


  # ==========================================
  # 3. DEPLOY PROD
  # ==========================================
  deploy-prod:
    name: Deploy to PROD

    # PROD solamente comienza si DEV terminó correctamente
    needs: deploy-dev

    runs-on: ubuntu-latest

    permissions:
      contents: read

    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Deploy to PROD
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --env production
